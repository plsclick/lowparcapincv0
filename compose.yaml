services:
  searxng:
    image: searxng/searxng@sha256:c750ee1d859b26d3aeae51c07f6a48c3a0bfbaa9195d71a18b258862d88c4c3c
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:rw,Z
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
    restart: unless-stopped
