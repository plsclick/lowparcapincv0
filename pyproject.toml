[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LowParLLMCapacityIncV0"
version = "0.1.0"
description = "A local AI assistant for the native terminal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpcore>=1.0,<2",
    "httpx>=0.27,<1",
    "prompt-toolkit>=3.0,<4",
    "python-docx>=1.1,<2",
    "pypdf>=5,<7",
    "qdrant-client>=1.12,<2",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
training = [
    "torch>=2.6",
    "transformers>=4.48,<5",
    "peft>=0.15,<1",
    "accelerate>=1.2,<2",
]
qlora = ["bitsandbytes>=0.45,<1"]
[project.scripts]
lowp = "lowparllm.main:main"

[tool.setuptools.packages.find]
include = ["lowparllm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
